<h2>Nuevo cliente</h2>

<form [formGroup]="form" (ngSubmit)="crear()">

  <label>Nombre:</label>
  <input formControlName="nombre">

  <label>Apellido 1:</label>
  <input formControlName="apellido1">

  <label>Apellido 2:</label>
  <input formControlName="apellido2">

  <label>Email:</label>
  <input formControlName="email">

  <label>Teléfono:</label>
  <input formControlName="telefono">

  <label>Dirección:</label>
  <input formControlName="direccion">

  <label>Población:</label>
  <input formControlName="poblacion">

  <label>Código Postal:</label>
  <input formControlName="codigo_postal" type="number">

  <label>País:</label>
  <input formControlName="pais">

  <button type="submit">Crear cliente</button>

</form>
